# If the app crashes with malloc/glibc errors after deploy, ensure Node 20 (nixpacks.toml)
# and that Prisma binaryTargets match the container OpenSSL (see prisma/schema.prisma).
[build]
builder = "nixpacks"
buildCommand = "npm install && npx prisma generate && npm run build"

[deploy]
# migrate deploy + auto-baseline when DB was previously managed with db push (Prisma P3005).
startCommand = "bash scripts/railway-start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
